<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#e94560" opacity="0.03"/>
  <circle cx="150" cy="500" r="250" fill="#ff6b6b" opacity="0.03"/>

  <!-- Clapperboard icon -->
  <rect x="80" y="200" width="180" height="130" rx="8" fill="#e94560" opacity="0.9"/>
  <rect x="80" y="200" width="180" height="28" rx="8" fill="#c0392b" opacity="0.9"/>
  <rect x="80" y="222" width="180" height="6" fill="#c0392b"/>
  <rect x="95" y="205" width="18" height="15" rx="2" fill="#ffeaa7"/>
  <rect x="125" y="205" width="18" height="15" rx="2" fill="#ffeaa7"/>
  <rect x="155" y="205" width="18" height="15" rx="2" fill="#ffeaa7"/>
  <rect x="185" y="205" width="18" height="15" rx="2" fill="#ffeaa7"/>
  <rect x="215" y="205" width="18" height="15" rx="2" fill="#ffeaa7"/>
  <polygon points="80,240 98,240 98,290 80,290" fill="#2d2d44"/>
  <polygon points="98,240 260,240 260,290 98,290" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5"/>
  <polygon points="145,250 145,280 182,265" fill="url(#play)" filter="url(#glow)"/>

  <!-- Title -->
  <text x="300" y="270" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="1">ArioClip</text>

  <!-- Tagline -->
  <text x="300" y="320" font-family="system-ui, sans-serif" font-size="22" fill="#a0a0b0" letter-spacing="1">
    <tspan>AI-Powered Video Clipping</tspan>
  </text>
  <text x="300" y="350" font-family="system-ui, sans-serif" font-size="18" fill="#707090" letter-spacing="0.5">
    <tspan>Transform Long Content into Viral Shorts</tspan>
  </text>

  <!-- Feature pills -->
  <rect x="300" y="390" width="120" height="28" rx="14" fill="#e94560" opacity="0.15"/>
  <text x="360" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="middle">AI Selection</text>

  <rect x="435" y="390" width="120" height="28" rx="14" fill="#e94560" opacity="0.15"/>
  <text x="495" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="middle">Face Tracking</text>

  <rect x="570" y="390" width="120" height="28" rx="14" fill="#e94560" opacity="0.15"/>
  <text x="630" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="middle">Captions</text>

  <rect x="705" y="390" width="120" height="28" rx="14" fill="#e94560" opacity="0.15"/>
  <text x="765" y="410" font-family="system-ui, sans-serif" font-size="12" fill="#ff6b6b" text-anchor="middle">Self-Hosted</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#e94560" opacity="0.08"/>
  <text x="600" y="610" font-family="system-ui, sans-serif" font-size="13" fill="#707090" text-anchor="middle" letter-spacing="1">OPEN SOURCE · AGPL-3.0 · FORK OF SUPOCLIP</text>

  <!-- Sparkle dots -->
  <circle cx="350" cy="180" r="4" fill="#ffeaa7" opacity="0.6"/>
  <circle cx="370" cy="165" r="2.5" fill="#ffeaa7" opacity="0.4"/>
  <circle cx="380" cy="190" r="2" fill="#ffeaa7" opacity="0.3"/>
  <circle cx="520" cy="440" r="3" fill="#ffeaa7" opacity="0.4"/>
  <circle cx="540" cy="450" r="2" fill="#ffeaa7" opacity="0.3"/>
</svg>
